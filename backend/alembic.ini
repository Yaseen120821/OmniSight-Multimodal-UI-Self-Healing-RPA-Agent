# Alembic configuration for OmniSight Backend
# See https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Path to the migrations directory (relative to this file)
script_location = alembic

# Template for revision file naming
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for the generated revision timestamps
timezone = UTC

# Truncate slug length so filenames stay short on Windows
truncate_slug_length = 40

# The database URL is read from the environment variable DATABASE_URL
# in alembic/env.py, so we leave this empty here.
sqlalchemy.url =

[post_write_hooks]
# No post-write hooks are configured.

[loggers]
keys = root, sqlalchemy, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
